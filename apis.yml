name: Axiom Trust
description: 'Axiom Trust Company is a vertically integrated trust company and technology
  platform serving investment advisors, attorneys, trustees, and private families.
  Founded in 2025 by David Meister and headquartered in Las Vegas, Nevada, Axiom pairs
  a regulated corporate trustee with a proprietary data-driven administration platform,
  using technology to remove the administrative bottleneck of traditional trust administration
  so named trust officers can focus on fiduciary judgment and family relationships.
  The company positions itself as infrastructure rather than a competitor for the client
  relationship: it acts as independent or directed trustee, handles bill pay, notices,
  distributions, approvals and principal & income accounting, and takes on complex mandates
  other institutions avoid — closely held entities, private investments, contested situations,
  and special needs trusts. Axiom raised $11.8M in pre-seed and seed funding led by
  Lightspeed Venture Partners, with Wischoff Ventures, Runa Capital, SNR, Primetime
  Partners, and Mercury founder Immad Akhund participating. As of this profile Axiom
  Trust publishes no public developer program, API documentation, or machine-readable
  API artifacts; its client-facing application is a private authenticated web app.'
